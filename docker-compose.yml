version: '3.8'

services:
  redis:
    image: redis:alpine
    ports:
      - "6379:6379"

  opensearch:
    image: opensearchproject/opensearch:2.11.0
    environment:
      - discovery.type=single-node
      - DISABLE_SECURITY_PLUGIN=true
    ports:
      - "9200:9200"

  backend:
    build: ./backend
    ports:
      - "5000:5000"
    depends_on:
      - redis
      - opensearch